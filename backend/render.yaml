services:
  - type: web
    name: btc-prediction-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./predictions.db
